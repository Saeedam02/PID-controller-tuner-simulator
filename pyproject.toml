[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-controller-tuner-simulator"
version = "2.0.0"
description = "Educational PID tuning and simulation toolkit with a Streamlit UI, plant models, metrics, disturbances, noise experiments, and open-loop model identification."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Saeed Agha Mohammadi"},
]
keywords = [
  "pid",
  "control-systems",
  "streamlit",
  "simulation",
  "ziegler-nichols",
  "fopdt",
  "control-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.0",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Saeedam02/PID-controller-tuner-simulator"
Repository = "https://github.com/Saeedam02/PID-controller-tuner-simulator"
Issues = "https://github.com/Saeedam02/PID-controller-tuner-simulator/issues"

[project.scripts]
pid-tuner-sim = "pid_tuner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pid_tuner"]
omit = ["src/pid_tuner/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
